# yaml-language-server: $schema=https://json.schemastore.org/pre-commit-config.json
# See https://pre-commit.com for more information
# See https://pre-commit.com/hooks.html for more hooks
repos:
  - repo: meta
    hooks:
      - id: check-hooks-apply
      - id: check-useless-excludes
      - id: identity

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
      - id: check-yaml
      - id: end-of-file-fixer
      - id: fix-byte-order-marker
      - id: trailing-whitespace

  - repo: https://github.com/qoomon/git-conventional-commits
    rev: v2.9.0
    hooks:
      - id: conventional-commits

  - repo: local
    hooks:
      - id: nix-format
        name: format nix files
        description: Format Nix files with nixpkgs-nixfmt
        entry: nix run nixpkgs#nixfmt --
        language: unsupported
        types: &nix_file_types
          - file
          - nix
          - non-executable
          - text
        require_serial: true
        stages:
          - pre-commit

      - id: nix-format-check
        name: check nix formatting
        description: Check Nix formatting with nixpkgs-nixfmt without modifying files
        entry: nix run nixpkgs#nixfmt -- --check
        language: unsupported
        types: *nix_file_types
        require_serial: true
        stages:
          - manual
          - pre-push

      - id: nix-validate
        name: validate nix files
        description: Validate that Nix files parse successfully
        entry: nix-instantiate --parse
        language: unsupported
        types: *nix_file_types
        stages:
          - pre-commit
          - pre-push
